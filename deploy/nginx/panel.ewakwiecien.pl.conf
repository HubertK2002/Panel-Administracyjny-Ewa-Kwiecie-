# Panel Ewy: https://panel.ewakwiecien.pl
# Document root points to Laravel's public directory, never the project root.

server {
    listen 80;
    server_name panel.ewakwiecien.pl;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name panel.ewakwiecien.pl;

    root /var/www/EwaAdminPanel/public;
    index index.php;
    charset utf-8;
    client_max_body_size 16M;

    ssl_certificate /etc/letsencrypt/live/impro.ewakwiecien.pl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/impro.ewakwiecien.pl/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/ewa-admin-panel.access.log;
    error_log /var/log/nginx/ewa-admin-panel.error.log;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico {
        access_log off;
        log_not_found off;
    }

    location = /robots.txt {
        access_log off;
        log_not_found off;
    }

    location ~ \.php$ {
        try_files $uri =404;
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
